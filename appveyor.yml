# AppVeyor configuration for Bears ADA Clock
# 1) Publish the app (self-contained single-file)
# 2) Build the MSI from the Visual Studio Installer project (.vdproj)
# 3) Upload the MSI as a build artifact; auto-publish to GitHub Releases on tags

version: 26.08.16.{build}

image: Visual Studio 2022

# The .vdproj cannot be built by MSBuild, so the default solution build is disabled
# and everything is done explicitly below.
# NOTE: the "Visual Studio Installer Projects" extension is already preinstalled on
# the "Visual Studio 2022" image, so no install step is needed (the AppVeyor
# setup.exe modify step used to fail with an empty exit code - see appveyor/ci #1773).
build: off

build_script:
  # 1) Publish the app. The .vdproj packages this publish output.
  - ps: 'dotnet publish "BearsAdaClock.csproj" -c Release -r win-x64 --self-contained true; if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }'
  # 2) Build the MSI with devenv (the only tool that supports .vdproj).
  #    The Installer Projects extension is preinstalled on this image, so no
  #    DisableOutOfProcBuild tweak is needed (running it from the repo root fails).
  - ps: '& "C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\IDE\devenv.com" "BearsAdaClock.sln" /Build "Release" /Project "Installer\Installer.vdproj"; if ($LASTEXITCODE -ne 0) { throw "devenv failed: $LASTEXITCODE" }'
  # 3) Log the produced MSI.
  - ps: 'Get-ChildItem -Path "Installer" -Recurse -Filter *.msi | Select-Object FullName,Length | Format-Table -AutoSize'

artifacts:
  - path: 'Installer\**\Bears ADA Clock Installer.msi'
    name: BearsADA Clock Installer (MSI)
  - path: 'Installer\**\setup.exe'
    name: BearsADA Clock Installer (setup.exe)

# On tag push, publish the MSI and bootstrapper to a GitHub Release.
# NOTE: set an encrypted environment variable named GITHUB_TOKEN
# (a repo token with "contents: write" scope) in AppVeyor project settings.
deploy:
  - provider: GitHub
    auth_token: $(GITHUB_TOKEN)
    description: 'Automated build of Bears ADA Clock'
    artifact: BearsADA Clock Installer (MSI), BearsADA Clock Installer (setup.exe)
    on:
      APPVEYOR_REPO_TAG: true
