# AppVeyor configuration for Bears ADA Clock
# 1) Publish the app (self-contained single-file)
# 2) Build the MSI with WiX via MSBuild
# 3) Upload the MSI as a build artifact; auto-publish to GitHub Releases on tags

version: 26.08.16.{build}

image: Visual Studio 2022

build: off

build_script:
  # 1) Publish the app (single-file self-contained EXE).
  - dotnet publish "BearsAdaClock.csproj" -c Release -r win-x64 --self-contained true
  # 2) Build the MSI with WiX via MSBuild.
  - ps: |
      $vsPath = & 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe' -latest -property installationPath
      $msbuild = Join-Path $vsPath 'MSBuild\Current\Bin\MSBuild.exe'
      $wixProj = Join-Path $env:APPVEYOR_BUILD_FOLDER 'Installer\BearsAdaClockInstaller.wixproj'
      & $msbuild $wixProj /p:Configuration=Release /p:Platform=x64 /v:minimal
      if ($LASTEXITCODE -ne 0) { throw "WiX build failed: $LASTEXITCODE" }
  # 3) Log the produced MSI.
  - ps: Get-ChildItem -Path "Installer" -Recurse -Filter *.msi | Select-Object FullName,Length | Format-Table -AutoSize

artifacts:
  - path: 'Installer\**\*.msi'
    name: BearsADA Clock Installer (MSI)

# On tag push, publish the MSI to a GitHub Release.
# NOTE: set an encrypted environment variable named GH_PAT
# (a repo token with "contents: write" scope) in AppVeyor project settings.
deploy:
  - provider: GitHub
    auth_token: $(GH_PAT)
    description: 'Automated build of Bears ADA Clock'
    artifact: BearsADA Clock Installer (MSI)
    on:
      APPVEYOR_REPO_TAG: true

# Auto-create a tag on successful commit builds (not tag-triggered builds).
on_success:
  - ps: |
      if ($env:APPVEYOR_REPO_TAG -ne "true") {
        $tag = "{0}.{1}" -f (Get-Date -Format "yyyy.MM.dd"), $env:APPVEYOR_BUILD_NUMBER
        git config user.email "ci@appveyor.com"
        git config user.name "AppVeyor"
        git tag $tag
        git push origin $tag
      }
